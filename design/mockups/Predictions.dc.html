<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick actions pitch view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D5AFE}a:hover{color:#2A44D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6FA; color: #10153A; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column">
  <div style="padding: 20px 16px 10px; display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E7EF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #10153A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <div style="font-family: Sora, sans-serif; font-size: 22px; font-weight: 700">GW12 actions</div>
      <div style="font-size: 13px; color: #5A6178">Tap a player to pick scoring actions · locks Sat 11:00</div>
    </div>
  </div>
  <div style="padding: 0 16px 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button type="button" style="height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E7EF; color: #10153A; font: 600 14px 'DM Sans', sans-serif">Same as last week</button>
    <button type="button" style="height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E7EF; color: #10153A; font: 600 14px 'DM Sans', sans-serif">Auto-pick</button>
  </div>
  <div style="margin: 0 16px; height: 524px; position: relative; border-radius: 18px; overflow: hidden; background: #13B556; box-shadow: 0 2px 10px rgba(16,21,58,0.12)"><div style="position: absolute; left: 0; right: 0; top: 0; height: 36px; z-index: 1; background: linear-gradient(90deg, #00D9C0, #3D5AFE); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-sizing: border-box; color: #FFFFFF; font-family: Sora, sans-serif; font-size: 15px; font-weight: 700; text-shadow: 0 1px 2px rgba(16,21,58,0.3)"><span>Your five</span><span>GW12 · v0.2 scoring</span></div><div style="position: absolute; left: -36px; right: -36px; top: 36px; height: 520px; transform: perspective(700px) rotateX(18deg); transform-origin: 50% 0%; background: repeating-linear-gradient(180deg, #13B556 0px, #13B556 44px, #10AB50 44px, #10AB50 88px)"><div style="position: absolute; left: 30px; right: 30px; top: 8px; bottom: 8px; border: 2px solid rgba(255,255,255,0.75)"></div><div style="position: absolute; left: 50%; width: 170px; margin-left: -85px; top: 8px; height: 52px; border: 2px solid rgba(255,255,255,0.75); border-top: 0"></div><div style="position: absolute; left: 50%; width: 170px; margin-left: -85px; bottom: 8px; height: 52px; border: 2px solid rgba(255,255,255,0.75); border-bottom: 0"></div><div style="position: absolute; left: 30px; right: 30px; top: 250px; height: 2px; background: rgba(255,255,255,0.75)"></div><div style="position: absolute; left: 50%; width: 84px; height: 84px; margin-left: -42px; top: 209px; border: 2px solid rgba(255,255,255,0.75); border-radius: 50%"></div></div>
    <sc-for list="{{players}}" as="p" hint-placeholder-count="5">
      <button type="button" style="position: absolute; left: {{p.left}}px; top: {{p.top}}px; width: 180px; background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: 'DM Sans', sans-serif; cursor: pointer">
        <div style="position: relative; width: 52px; height: 49px">
          <dc-import name="Shirt" num="{{p.num}}" tier="{{p.tier}}" size="56" hint-size="56px,52px"></dc-import>
          <sc-if value="{{p.captain}}" hint-placeholder-val="{{false}}">
            <div style="position: absolute; right: -8px; top: -4px; width: 20px; height: 20px; border-radius: 10px; background: #10153A; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">C</div>
          </sc-if>
        </div>
        <div style="min-width: 78px; border-radius: 5px; overflow: hidden; box-shadow: 0 1px 4px rgba(16,21,58,0.28); text-align: center"><div style="background: #FFFFFF; color: #10153A; font-size: 12px; font-weight: 700; padding: 2px 8px">{{p.name}}</div><div style="background: #EEF1F6; color: #10153A; font-size: 10px; font-weight: 600; padding: 1px 8px">{{p.fixture}}</div></div>
        <div style="display: flex; gap: 4px; justify-content: center">
          <sc-for list="{{p.slots}}" as="s" hint-placeholder-count="2">
            <div style="height: 24px; padding: 0 8px; border-radius: 7px; background: {{s.bg}}; border: 1.5px {{s.borderStyle}} {{s.border}}; color: {{s.color}}; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px; white-space: nowrap">
              <span>{{s.label}}</span>
              <span style="color: #3D5AFE; font-weight: 700">{{s.pts}}</span>
            </div>
          </sc-for>
        </div>
      </button>
    </sc-for>
  </div>
  <div style="margin: 10px 16px 0; background: #FFFFFF; border: 1px solid #E3E7EF; border-radius: 14px; padding: 8px 12px; display: flex; align-items: center; gap: 10px">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #5A6178">SUB</span>
    <dc-import name="Shirt" num="41" tier="bronze" size="34" hint-size="34px,32px"></dc-import>
    <span style="font-size: 13px; font-weight: 600">Rice <span style="font-weight: 500; color: #5A6178">v CHE</span></span>
    <span style="margin-left: auto; height: 24px; padding: 0 8px; border-radius: 7px; background: #F4F6FA; border: 1px solid #E3E7EF; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px">3+ tackles <span style="color: #3D5AFE; font-weight: 700">+8</span></span>
  </div>
  <div style="margin-top: auto; padding: 12px 16px 22px; border-top: 1px solid #E3E7EF; display: flex; align-items: center; gap: 12px; background: #FFFFFF">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 12px; color: #5A6178">If every action lands</div>
      <div style="font-family: Sora, sans-serif; font-size: 24px; font-weight: 700">113 pts</div>
    </div>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; padding: 0 32px; border-radius: 14px; background: #10153A; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Confirm</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const filled = (label, pts, bold) => ({ label, pts: '+' + pts, bg: '#FFFFFF', border: bold ? '#E07B00' : '#FFFFFF', borderStyle: 'solid', color: '#10153A' });
    const empty = () => ({ label: '+ Add', pts: '', bg: 'rgba(255,255,255,0.15)', border: '#FFFFFF', borderStyle: 'dashed', color: '#FFFFFF' });
    const gold = '#B8860B', silver = '#7C8796', elite = '#6A55E0';
    return {
      players: [
        { num: 9, name: 'Haaland', fixture: 'BRE (H)', tier: 'elite', captain: true, left: 89, top: 48, slots: [filled('Goal', 5), filled('2+ goals', 20)] },
        { num: 7, name: 'Saka', fixture: 'CHE (H)', tier: 'gold', captain: false, left: 0, top: 166, slots: [filled('Assist · bold', 15, true), empty()] },
        { num: 8, name: 'Fernandes', fixture: 'NEW (A)', tier: 'silver', captain: false, left: 178, top: 166, slots: [filled('Goal inv.', 8), empty()] },
        { num: 4, name: 'Van Dijk', fixture: 'WHU (H)', tier: 'gold', captain: false, left: 89, top: 284, slots: [filled('Clean sheet', 8), filled('Def. actions', 7)] },
        { num: 1, name: 'Pickford', fixture: 'BOU (A)', tier: 'silver', captain: false, left: 89, top: 402, slots: [filled('3+ saves', 3), filled('Clean sheet', 7)] }
      ]
    };
  }
}
</script>
</body>
</html>
