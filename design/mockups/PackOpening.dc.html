<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pack opening reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D5AFE}a:hover{color:#2A44D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6FA; color: #10153A; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; padding: 24px 20px 28px; gap: 20px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6178">Player pack</div>
    <a href="Main.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E7EF; color: #10153A; font-size: 14px; font-weight: 600; text-decoration: none">Skip</a>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <div style="font-size: 14px; font-weight: 700; letter-spacing: 0.2em; color: #8A6508">GOLD · NEW CARD</div>
    <div style="width: 260px; height: 380px; box-sizing: border-box; border-radius: 22px; border: 3px solid #B8860B; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; box-shadow: 0 0 0 10px rgba(184,134,11,0.10), 0 0 0 22px rgba(184,134,11,0.05)">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #8A6508">GOLD</span>
        <span style="font-family: Sora, sans-serif; font-size: 22px; font-weight: 700; padding: 2px 10px; border-radius: 8px; background: #FBF5E4">86</span>
      </div>
      <div style="flex: 1; display: flex; align-items: center; justify-content: center"><dc-import name="Shirt" num="20" tier="gold" size="150" hint-size="150px,141px"></dc-import></div>
      <div style="font-size: 26px; font-weight: 700">C. Palmer</div>
      <div style="font-size: 14px; color: #5A6178; margin-top: 2px">MID · CHE</div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid #E3E7EF">
        <span style="font-size: 12px; color: #5A6178">Form <span style="color: #10153A; font-weight: 600">8 · 2 · 12 · 6 · 9</span></span>
        <span style="font-size: 12px; color: #5A6178">2 action slots</span>
      </div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <a href="Predictions.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #10153A; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Put in my five</a>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 48px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E7EF; color: #10153A; font: 600 14px 'DM Sans', sans-serif">Keep in collection</button>
      <button type="button" style="height: 48px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E7EF; color: #10153A; font: 600 14px 'DM Sans', sans-serif">Swap for a pack</button>
    </div>
    <button type="button" style="height: 44px; background: none; border: 0; color: #5A6178; font: 500 13px 'DM Sans', sans-serif; text-decoration: underline">View this pack’s odds</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
