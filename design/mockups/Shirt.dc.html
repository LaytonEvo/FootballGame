<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player shirt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; line-height: 0">
  <svg width="{{w}}" height="{{h}}" viewBox="0 0 64 60" role="img" aria-label="{{label}}">
    <path d="M21 5 10 9.5 2.5 22l8.5 5.5 4.5-6.5V55a3 3 0 0 0 3 3h27a3 3 0 0 0 3-3V21l4.5 6.5L61.5 22 54 9.5 43 5c-2 4-6 6.5-11 6.5S23 9 21 5z" fill="#FFFFFF"></path>
    <path d="M21 5 10 9.5 2.5 22l8.5 5.5 4.5-6.5V14z" fill="{{color}}"></path>
    <path d="M43 5 54 9.5 61.5 22 53 27.5 48.5 21V14z" fill="{{color}}"></path>
    <path d="M3.8 20 12.6 25.4" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85"></path>
    <path d="M60.2 20 51.4 25.4" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85"></path>
    <rect x="15.5" y="24" width="3" height="31" fill="{{color}}" opacity="0.9"></rect>
    <rect x="45.5" y="24" width="3" height="31" fill="{{color}}" opacity="0.9"></rect>
    <path d="M32 11.5c5 0 9-2.5 11-6.5l-3-1.2c-1.6 2.8-4.5 4.5-8 4.5s-6.4-1.7-8-4.5L21 5c2 4 6 6.5 11 6.5z" fill="{{color}}"></path>
    <path d="M32 11.5V58h13.5a3 3 0 0 0 3-3V21l4.5 6.5L61.5 22 54 9.5 43 5c-2 4-6 6.5-11 6.5z" fill="#10153A" opacity="0.05"></path>
    <path d="M21 5 10 9.5 2.5 22l8.5 5.5 4.5-6.5V55a3 3 0 0 0 3 3h27a3 3 0 0 0 3-3V21l4.5 6.5L61.5 22 54 9.5 43 5c-2 4-6 6.5-11 6.5S23 9 21 5z" fill="none" stroke="#10153A" stroke-opacity="0.3" stroke-width="1.2" stroke-linejoin="round"></path>
    <text x="32" y="43" text-anchor="middle" font-family="Sora, sans-serif" font-weight="700" font-size="{{fontSize}}" fill="#10153A" letter-spacing="-0.5">{{num}}</text>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"num":{"editor":"int","default":7},"tier":{"editor":"enum","options":["bronze","silver","gold","elite"],"default":"gold"},"size":{"editor":"int","default":64,"min":24,"max":160},"$preview":{"width":64,"height":60}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { bronze: '#A9683A', silver: '#7C8796', gold: '#B8860B', elite: '#6A55E0' };
    const tier = this.props.tier ?? 'gold';
    const num = this.props.num ?? 7;
    const w = parseInt(this.props.size ?? 64, 10) || 64;
    return {
      w,
      h: Math.round(w * 60 / 64),
      color: colors[tier] || colors.gold,
      num,
      fontSize: String(num).length > 1 ? 21 : 24,
      label: 'Shirt number ' + num + ', ' + tier + ' card'
    };
  }
}
</script>
</body>
</html>
