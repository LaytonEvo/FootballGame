<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gameweek recap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D5AFE}a:hover{color:#2A44D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6FA; color: #10153A; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 22px 16px 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-family: Sora, sans-serif; font-size: 22px; font-weight: 700">GW12 recap</div>
      <div style="font-size: 12px; color: #5A6178">Final · Mon 09:00</div>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 12px">
      <div style="font-family: Sora, sans-serif; font-size: 64px; font-weight: 700; line-height: 0.9; letter-spacing: -0.03em">66</div>
      <div style="display: flex; flex-direction: column; padding-bottom: 2px">
        <span style="font-size: 15px; color: #5A6178">pts</span>
        <span style="font-size: 15px; font-weight: 600">6 of 8 actions landed</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #FFFFFF; border: 1px solid #E3E7EF; border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #5A6178">Office League</span>
        <span style="font-size: 15px; font-weight: 700">2nd <span style="color: #3D5AFE; font-size: 12px">▲ 1</span></span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E3E7EF; border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #5A6178">Global</span>
        <span style="font-size: 15px; font-weight: 700">Top 15%</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E3E7EF; border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #5A6178">Coins</span>
        <span style="font-size: 15px; font-weight: 700">+66</span>
      </div>
    </div>
    <div style="height: 300px; position: relative; border-radius: 18px; overflow: hidden; background: #13B556; box-shadow: 0 2px 10px rgba(16,21,58,0.12)"><div style="position: absolute; left: -36px; right: -36px; top: 0px; height: 320px; transform: perspective(700px) rotateX(18deg); transform-origin: 50% 0%; background: repeating-linear-gradient(180deg, #13B556 0px, #13B556 44px, #10AB50 44px, #10AB50 88px)"><div style="position: absolute; left: 30px; right: 30px; top: 8px; bottom: 8px; border: 2px solid rgba(255,255,255,0.75)"></div><div style="position: absolute; left: 50%; width: 170px; margin-left: -85px; top: 8px; height: 52px; border: 2px solid rgba(255,255,255,0.75); border-top: 0"></div><div style="position: absolute; left: 50%; width: 170px; margin-left: -85px; bottom: 8px; height: 52px; border: 2px solid rgba(255,255,255,0.75); border-bottom: 0"></div><div style="position: absolute; left: 30px; right: 30px; top: 150px; height: 2px; background: rgba(255,255,255,0.75)"></div><div style="position: absolute; left: 50%; width: 84px; height: 84px; margin-left: -42px; top: 109px; border: 2px solid rgba(255,255,255,0.75); border-radius: 50%"></div></div>
    <sc-for list="{{players}}" as="p" hint-placeholder-count="5">
        <div style="position: absolute; left: {{p.left}}px; top: {{p.top}}px; width: 140px; display: flex; flex-direction: column; align-items: center; gap: 3px">
          <div style="position: relative; width: 46px; height: 43px">
            <dc-import name="Shirt" num="{{p.num}}" tier="{{p.tier}}" size="46" hint-size="46px,43px"></dc-import>
            <sc-if value="{{p.captain}}" hint-placeholder-val="{{false}}">
              <div style="position: absolute; right: -8px; top: -4px; width: 18px; height: 18px; border-radius: 9px; background: #10153A; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">C</div>
            </sc-if>
          </div>
          <div style="display: flex; border-radius: 6px; overflow: hidden; font-size: 12px; font-weight: 700">
            <span style="padding: 2px 6px; background: #FFFFFF">{{p.name}}</span>
            <span style="padding: 2px 6px; background: #10153A; color: #FFFFFF">{{p.pts}}</span>
          </div>
          <span style="font-size: 10px; font-weight: 600; color: #FFFFFF">{{p.landed}}</span>
        </div>
      </sc-for>
    </div>
    <div style="background: #E0FBF7; border: 1.5px solid #00B8A3; border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 12px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #3D5AFE">BEST ACTION</span>
        <span style="font-size: 15px; font-weight: 700">Saka assist · bold</span>
      </div>
      <span style="font-family: Sora, sans-serif; font-size: 22px; font-weight: 700; color: #3D5AFE">+30</span>
    </div>
    <div style="background: #FFFFFF; border: 1.5px solid #7C8796; border-radius: 14px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; font-size: 14px; font-weight: 600">Player pack unlocked</span>
      <a href="PackOpening.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 10px; background: #10153A; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none">Open</a>
    </div>
    <a href="ShareCard.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px; background: #10153A; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"></path></svg>
      Share my week
    </a>
  </div>
  <dc-import name="TabBar" active="home" hint-size="390px,76px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const gold = '#B8860B', silver = '#7C8796', elite = '#6A55E0';
    return {
      players: [
        { num: 9, name: 'Haaland', pts: 10, landed: '1 of 2', tier: 'elite', captain: true, left: 109, top: 12 },
        { num: 7, name: 'Saka', pts: 30, landed: '1 of 1', tier: 'gold', captain: false, left: 20, top: 82 },
        { num: 8, name: 'Fernandes', pts: 8, landed: '1 of 1', tier: 'silver', captain: false, left: 198, top: 82 },
        { num: 4, name: 'Van Dijk', pts: 15, landed: '2 of 2', tier: 'gold', captain: false, left: 109, top: 156 },
        { num: 1, name: 'Pickford', pts: 3, landed: '1 of 2', tier: 'silver', captain: false, left: 109, top: 222 }
      ]
    };
  }
}
</script>
</body>
</html>
