<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home before deadline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D5AFE}a:hover{color:#2A44D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6FA; color: #10153A; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6178">Gameweek 12</div>
      <a href="Rewards.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E7EF; color: #10153A; font-size: 13px; font-weight: 600; text-decoration: none">86 Coins <span style="width: 40px; height: 6px; border-radius: 3px; background: #E6EAF2; overflow: hidden; display: inline-block"><span style="display: block; width: 86%; height: 100%; background: #10153A"></span></span> <span style="color: #3D5AFE">14 to pack</span></a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 15px; color: #5A6178">Actions lock in</div>
      <div style="font-family: Sora, sans-serif; font-size: 46px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05">1d 4h 12m</div>
      <div style="font-size: 14px; color: #5A6178">Sat 11:00 · first kick-off 12:30</div>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #E3E7EF; border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
        <span style="font-size: 14px; font-weight: 600">Your five</span>
        <span style="font-size: 13px; color: #5A6178">0 of 5 set</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{squad}}" as="p" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
            <dc-import name="Shirt" num="{{p.num}}" tier="{{p.tier}}" size="44" hint-size="44px,41px"></dc-import>
            <span style="font-size: 11px; font-weight: 600">{{p.name}}</span>
            <span style="font-size: 10px; color: #5A6178">{{p.pos}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <a href="Predictions.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #10153A; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">Pick your actions</a>
    <div style="background: #FFFFFF; border: 1px solid #E3E7EF; border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 13px; color: #5A6178">Office League</div>
        <div style="font-family: Sora, sans-serif; font-size: 24px; font-weight: 700">3rd of 14</div>
        <div style="font-size: 13px; color: #5A6178">412 pts · 18 behind 2nd</div>
      </div>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; background: #F4F6FA; border: 1px solid #E3E7EF; color: #10153A; font: 600 14px 'DM Sans', sans-serif">Table</button>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; border: 1.5px solid #B8860B">
      <div style="width: 40px; height: 54px; border-radius: 8px; background: #FBF5E4; border: 2px solid #B8860B; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A6508" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 16px; font-weight: 600">1 player pack ready</div>
        <div style="font-size: 13px; color: #5A6178">Earned in GW11</div>
      </div>
      <a href="PackOpening.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 12px; background: #10153A; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none">Open</a>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 2px">
      <div style="font-size: 14px; color: #5A6178">GW11 · 34 pts · 5 of 9 actions landed</div>
      <a href="Recap.dc.html" style="font-size: 14px; font-weight: 600; text-decoration: none">Recap</a>
    </div>
  </div>
  <dc-import name="TabBar" active="home" hint-size="390px,76px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      squad: [
        { num: 1, name: 'Pickford', pos: 'GK', tier: 'silver' },
        { num: 4, name: 'Van Dijk', pos: 'DEF', tier: 'gold' },
        { num: 7, name: 'Saka', pos: 'MID', tier: 'gold' },
        { num: 8, name: 'Fernandes', pos: 'MID', tier: 'silver' },
        { num: 9, name: 'Haaland', pos: 'FWD', tier: 'elite' }
      ]
    };
  }
}
</script>
</body>
</html>
